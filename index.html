<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cross-platform C++20 and Vulkan engine and project tooling." />
    <meta name="theme-color" content="#252b35" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%assets/brand.svg" />
    <title>Zodiac Engine</title>
    <script>
      try {
        const saved = localStorage.getItem('zodiac-theme');
        document.documentElement.dataset.theme = saved === 'dark' || saved === 'light'
          ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (error) {
        console.warn('Theme preference could not be read', error);
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This documentation requires JavaScript. Read the Markdown sources at <a href="https://github.com/JeanPhilippeKernel/RendererEngine/tree/develop/docs">GitHub</a>.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
